services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pix
      POSTGRES_USER: pix
      POSTGRES_PASSWORD: pix
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pix -d pix"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/pix
      DATABASE_USER: pix
      DATABASE_PASSWORD: pix
      PIX_WEBHOOK_TOKEN: troque-este-token
    ports:
      - "8080:8080"
