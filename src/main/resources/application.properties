spring.application.name=pix-cobrancas

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pix}
spring.datasource.username=${DATABASE_USER:pix}
spring.datasource.password=${DATABASE_PASSWORD:pix}

# O schema é do Flyway; o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Segredo que o PSP manda no cabeçalho X-Webhook-Token. Sem ele a aplicação não sobe.
pix.webhook.token=${PIX_WEBHOOK_TOKEN}
pix.expiracao-padrao=PT1H
pix.conciliacao.agendada=true
pix.conciliacao.intervalo=PT1M
pix.conciliacao.idade-minima=PT2M
