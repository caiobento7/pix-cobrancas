# Perfil para testar sem Docker: banco H2 em memória imitando o PostgreSQL.
spring.datasource.url=jdbc:h2:mem:pix;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

pix.webhook.token=token-local
pix.conciliacao.intervalo=PT20S
pix.conciliacao.idade-minima=PT30S
