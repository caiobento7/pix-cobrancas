name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.banco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        banco: [h2, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pix
          POSTGRES_USER: pix
          POSTGRES_PASSWORD: pix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pix -d pix"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes com H2
        if: matrix.banco == 'h2'
        run: ./mvnw -B verify
      - name: Testes com PostgreSQL de verdade (mesmas migrações do Flyway)
        if: matrix.banco == 'postgres'
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pix
          SPRING_DATASOURCE_USERNAME: pix
          SPRING_DATASOURCE_PASSWORD: pix
        run: ./mvnw -B verify

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pix-cobrancas .
